aid: fabric
name: Fabric
description: 'Fabric is a healthcare care-enablement platform (formerly Zipnosis,
  rebranded to Fabric in 2024) that streamlines access to virtual and in-person care.
  Its AI-powered system automates patient intake, symptom gathering, triage, and routing
  while integrating with existing EMR systems, serving health systems, hospitals,
  health plans, employers, and brokers. The platform spans synchronous and asynchronous
  virtual care delivery, an AI navigation and symptom-checking assistant, an intelligent
  provider directory and scheduling layer, a 50-state virtual clinical network (Evo),
  and patient engagement and care-management pathways. Fabric was assembled through
  the acquisitions of Zipnosis, GYANT, MeMD, TeamHealth Virtual Care, and UCM Digital
  Health. As of this profile Fabric does not publish a public developer API, SDKs,
  or a developer portal; integration is EMR-based and arranged via sales.'
